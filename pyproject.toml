[project]
name = "vendorops-agent"
version = "0.1.0"
description = "VendorOps agent runtime on Bedrock AgentCore"
readme = "README.md"
authors = [
    { name = "TejaReddy91", email = "bvsktejareddy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore>=1.22.0",
    "boto3>=1.43.78",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "strands-agents>=1.53.0",
]

[project.scripts]
vendorops-agent = "vendorops_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
